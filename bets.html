<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* ========= THEME ========= */
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #111111;
            --muted: #6b7280;
            --accent: #16a34a;
            --border: #e5e7eb;
            --grid: #eeeeee;
        }

        [data-theme="dark"] {
            --bg: #0b0c0f;
            --card: #14161b;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --accent: #22c55e;
            --border: #262a32;
            --grid: #1f232b;
        }

        /* ========= BASE ========= */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 100%;
            width: 100%;
            margin: auto;
            padding: 1.5rem;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* ========= CARDS ========= */
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            margin-bottom: 2rem;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        label {
            font-size: 0.85rem;
            color: var(--muted);
        }

        input[type="number"] {
            padding: 0.45rem 0.7rem;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            width: 140px;
        }

        /* ========= TOGGLE ========= */
        .toggle {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--muted);
        }

        /* ========= STATS ========= */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat {
            font-size: 0.9rem;
        }

        .stat b {
            display: block;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        /* ========= CHART ========= */
        .chart-wrapper {
            height: 280px;
        }

        /* ========= TABLE ========= */
        .table-wrapper {
            overflow-x: auto;
            max-width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 600px;
        }

        th, td {
            padding: 0.85rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
        }

        tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* ========= MOBILE ========= */
        @media (max-width: 768px) {
            h1 { font-size: 1.4rem; }
            .chart-wrapper { height: 220px; }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Betting Tracker</h1>

    <div class="card">
        <div class="row">
            <div>
                <label>Initial Bankroll (€)</label><br>
                <input type="number" id="bankrollInput" value="100" min="1" step="any">
            </div>
            <div class="toggle" id="themeToggle">🌙 Dark mode</div>
        </div>

        <div class="cap-controls" style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border);">
            <div class="row">
                <div>
                    <label>Cap min (%)</label><br>
                    <input type="number" id="capMinInput" value="0.01" min="0.01" max="50" step="0.01" style="width:80px;">
                </div>
                <div>
                    <label>Cap max (%)</label><br>
                    <input type="number" id="capMaxInput" value="10" min="0.01" max="100" step="0.01" style="width:80px;">
                </div>
                <div>
                    <label>Pas (%)</label><br>
                    <input type="number" id="capStepInput" value="0.01" min="0.001" max="5" step="0.001" style="width:70px;">
                </div>
                <div>
                    <label>&nbsp;</label><br>
                    <button id="calcCapBtn" style="padding:0.45rem 1rem; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;">
                        🎯 Optimiser
                    </button>
                </div>
            </div>
            <div id="capResult" style="margin-top:0.5rem; font-size:0.9rem; color:var(--accent); font-weight:600;"></div>
            <div style="margin-top:0.5rem; display:flex; gap:1.5rem; align-items:center;">
                <label style="cursor:pointer; display:flex; align-items:center; gap:0.4rem;">
                    <input type="radio" name="capMode" value="kelly" checked> Kelly
                </label>
                <label style="cursor:pointer; display:flex; align-items:center; gap:0.4rem;">
                    <input type="radio" name="capMode" value="capped"> Kelly + Cap
                </label>
                <label style="cursor:pointer; display:flex; align-items:center; gap:0.4rem;">
                    <input type="radio" name="capMode" value="flat"> Mise fixe
                </label>
            </div>
        </div>
        <div class="stats" id="perfStats"></div>
        <div class="stats" id="cappedStats" style="margin-top:0.5rem;"></div>
    </div>

    <div class="card">
        <div class="row">
            <div class="chart-wrapper" style="flex:2; min-width:0;">
                <canvas id="performanceChart"></canvas>
            </div>
            <div style="flex:1; min-width:220px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2rem;">
                <div style="width:210px;">
                    <canvas id="statusPieChart"></canvas>
                    <div id="pieStats" style="text-align:center; margin-top:0.5rem; font-size:0.95rem;"></div>
                </div>
                <div style="width:210px;">
                    <canvas id="sportPieChart"></canvas>
                    <div id="sportPieStats" style="text-align:center; margin-top:0.5rem; font-size:0.95rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0;font-size:1.1rem;">History</h2>
        <div class="table-wrapper">
            <table id="betsTable">
                <thead>
                <tr>
                    <th data-col="0">Sport</th>
                    <th data-col="1">Bookmaker</th>
                    <th data-col="3">Date</th>
                    <th data-col="4">Event</th>
                    <th data-col="5">Result</th>
                    <th data-col="6">Odds</th>
                    <th data-col="9">Stake</th>
                    <th data-col="8">Winnings</th>
                    <th data-col="11">Bankroll</th>
                    <th data-col="10">Won?</th>
                </tr>
                <tr id="filterRow">
                    <th><input type="text" data-col="0" style="width:90%"></th>
                    <th><input type="text" data-col="1" style="width:90%"></th>
                    <th><input type="text" data-col="3" style="width:90%"></th>
                    <th><input type="text" data-col="4" style="width:90%"></th>
                    <th><input type="text" data-col="5" style="width:90%"></th>
                    <th><input type="text" data-col="6" style="width:90%"></th>
                    <th><input type="text" data-col="9" style="width:90%"></th>
                    <th><input type="text" data-col="8" style="width:90%"></th>
                    <th><input type="text" data-col="11" style="width:90%"></th>
                    <th><input type="text" data-col="10" style="width:90%"></th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1n30c7z0w0pjch9r6svRKohpPGMm1ePx9_KxhNgBkdCQ/export?format=csv&gid=786289597';
    const baseBankroll = 100;
    let chart, dataRows = [], pieChart, sportPieChart;
    let sortCol = null, sortDir = 1; // 1 = desc, -1 = asc
    let filters = {};
    let optimalCap = null;
    let optimalFlat = null;
    let capMode = 'kelly';

    const parseDate = s => {
        const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?: (\d{1,2}):(\d{2}))?/);
        if (!m) return null;
        return new Date(m[3], m[2]-1, m[1], m[4]||0, m[5]||0);
    };

    fetch(sheetUrl)
        .then(r => r.text())
        .then(csv => {
            Papa.parse(csv, {
                skipEmptyLines: true,
                complete: res => {
                    dataRows = res.data.slice(6).filter(r => r[0]);
                    init();
                }
            });
        });

    function init() {
        chart = new Chart(document.getElementById('performanceChart'), {
            type: "line",
            data: { labels: [], datasets: [{
                    data: [],
                    borderWidth: 2,
                    tension: 0.35,
                    pointRadius: 0
                }]},
            options: chartOptions()
        });
        bankrollInput.addEventListener("input", update);
        calcCapBtn.addEventListener("click", calcAndOptimize);
        document.querySelectorAll('input[name="capMode"]').forEach(r => r.addEventListener("change", update));
        // Ajout listeners tri
        betsTable.querySelectorAll('thead th[data-col]').forEach(th => {
            th.style.cursor = 'pointer';
            th.onclick = () => {
                const col = th.getAttribute('data-col');
                if (sortCol === col) sortDir = -sortDir;
                else { sortCol = col; sortDir = 1; }
                update();
            };
        });
        // Ajout listeners filtres
        betsTable.querySelectorAll('#filterRow input').forEach(input => {
            input.oninput = () => {
                filters[input.getAttribute('data-col')] = input.value.toLowerCase();
                update();
            };
        });
        update();
    }

    function update() {
        const mult = bankrollInput.value / baseBankroll;
        const { bankrolls, indices } = renderTable(mult);
        renderStats(mult);
        renderSportPieChart();
        renderCapChart(mult, bankrolls, indices);
        renderAltStats(mult);
    }

    function renderTable(mult) {
        const tbody = betsTable.querySelector("tbody");
        tbody.innerHTML = "";
        let rows = dataRows.slice();
        // Appliquer les filtres
        Object.entries(filters).forEach(([col, val]) => {
            if (val)
                rows = rows.filter(r => (r[col]||"").toLowerCase().includes(val));
        });
        // Appliquer le tri
        if (sortCol !== null) {
            rows.sort((a, b) => {
                let va = a[sortCol]||"", vb = b[sortCol]||"";
                // Numérique si possible
                if (!isNaN(parseFloat(va)) && !isNaN(parseFloat(vb))) {
                    va = parseFloat(va.replace(',', '.'));
                    vb = parseFloat(vb.replace(',', '.'));
                }
                if (va < vb) return sortDir;
                if (va > vb) return -sortDir;
                return 0;
            });
        }
        let bankrolls = [];
        let indices = [];
        let winCount = 0, loseCount = 0, pendingCount = 0;
        rows.forEach(r => {
            indices.push(dataRows.indexOf(r));
            const eventDate = r[3];
            const gagne = (r[10] || "").toLowerCase();
            let gagneLabel = "pending", gagneColor = "#a259e6";
            if (gagne === "oui") { gagneLabel = "yes"; gagneColor = "#22c55e"; winCount++; }
            else if (gagne === "non") { gagneLabel = "no"; gagneColor = "#ef4444"; loseCount++; }
            else { pendingCount++; }
            const gains = r[8] ? (parseFloat(r[8].replace(',', '.')) * mult).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0,00";
            const bankroll = r[11] ? (parseFloat(r[11].replace(',', '.')) * mult).toFixed(2) : "0.00";
            bankrolls.push(bankroll);
            tbody.insertAdjacentHTML("beforeend", `
        <tr>
            <td>${r[0]}</td>
            <td>${r[1]}</td>
            <td>${eventDate}</td>
            <td>${r[4]}</td>
            <td>${r[5]}</td>
            <td>${r[6]}</td>
            <td>${r[7]}</td>
            <td>${gains}€</td>
            <td>${bankroll}€</td>
            <td><span style="color:${gagneColor};font-weight:600;">${gagneLabel}</span></td>
        </tr>
        `);
        });
        renderPieChart(winCount, loseCount, pendingCount);
        return { bankrolls, indices };
    }


    function renderPieChart(win, lose, pending) {
        const total = win+lose+pending;
        const data = [win, lose, pending];
        const labels = ["Won", "Lost", "Pending"];
        const colors = ["#22c55e", "#ef4444", "#a259e6"];
        if(!pieChart) {
            pieChart = new Chart(document.getElementById('statusPieChart'), {
                type: 'pie',
                data: {
                    labels,
                    datasets: [{ data, backgroundColor: colors }]
                },
                options: {
                    plugins: {
                        legend: { display: true, position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted') } }
                    }
                }
            });
        } else {
            pieChart.data.datasets[0].data = data;
            pieChart.update();
        }
        let html = '';
        [win, lose, pending].forEach((n,i) => {
            const pct = total ? (n/total*100).toFixed(1) : '0.0';
            html += `<span style="color:${colors[i]};font-weight:600;">${labels[i]}</span> : ${pct}% (${n})<br>`;
        });
        pieStats.innerHTML = html;
    }

    function renderSportPieChart() {
        // Compter les occurrences par sport
        const sportCounts = {};
        dataRows.forEach(r => {
            const sport = r[0] || "Unknown";
            sportCounts[sport] = (sportCounts[sport] || 0) + 1;
        });
        const labels = Object.keys(sportCounts);
        const data = Object.values(sportCounts);
        const total = data.reduce((a, b) => a + b, 0);
        const colors = [
            "#22c55e", "#ef4444", "#a259e6", "#f59e42", "#3b82f6", "#eab308", "#10b981", "#6366f1"
        ];
        if (!sportPieChart) {
            sportPieChart = new Chart(document.getElementById('sportPieChart'), {
                type: 'pie',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: colors.slice(0, labels.length)
                    }]
                },
                options: {
                    plugins: {
                        legend: { display: true, position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted') } }
                    }
                }
            });
        } else {
            sportPieChart.data.labels = labels;
            sportPieChart.data.datasets[0].data = data;
            sportPieChart.update();
        }
        // Affichage des stats
        let html = '';
        labels.forEach((sport, i) => {
            const pct = total ? (data[i] / total * 100).toFixed(1) : '0.0';
            html += `<span style="color:${colors[i % colors.length]};font-weight:600;">${sport}</span> : ${pct}% (${data[i]})<br>`;
        });
        sportPieStats.innerHTML = html;
    }

    function renderStats(mult) {
        const first = parseDate(dataRows[0][2]); // Date prise de paris
        const last = parseDate(dataRows[dataRows.length-1][2]); // Date de l'évènement
        const start = baseBankroll * mult;
        const end = parseFloat(dataRows[dataRows.length-1][11].replace(',', '.')) * mult;

        const perf = end - start;
        const pct = (end/start - 1) * 100;

        const days = (last-first)/86400000;
        const months = days / 30.4375;
        const years = days / 365.25;

        const ann = (Math.pow(end/start, 1/years)-1)*100;
        const mon = (Math.pow(end/start, 1/months)-1)*100;

        perfStats.innerHTML = `
    <div class="stat">
        <b>Performance</b>
        <span style="color:${perf>=0?'var(--accent)':'red'}">
            ${perf.toFixed(2)}€ (${pct.toFixed(2)}%)
        </span>
    </div>
    <div class="stat">
        <b>Annualized</b>
        ${isFinite(ann)?ann.toFixed(2):'—'} %
    </div>
    <div class="stat">
        <b>Monthly</b>
        ${isFinite(mon)?mon.toFixed(2):'—'} %
    </div>
    <div class="stat">
        <b>Duration</b>
        ${days.toFixed(0)} days
    </div>
    `;
    }


    /* ========= THEME ========= */
    themeToggle.onclick = () => {
        const root = document.documentElement;
        const dark = root.dataset.theme === "dark";
        root.dataset.theme = dark ? "light" : "dark";
        themeToggle.textContent = dark ? "🌙 Dark mode" : "☀️ Light mode";
        update();
    };

    function calcAndOptimize() {
        const min = +capMinInput.value || 0.01;
        const max = +capMaxInput.value || 10;
        const step = +capStepInput.value || 0.01;

        calcOptimalCap(min, max, step);
        calcOptimalFlat(min, max, step);
        renderOptimizationResult();
        document.querySelector('input[name="capMode"][value="capped"]').checked = true;
        capMode = 'capped';
        update();
    }

    function renderOptimizationResult() {
        const mult = +bankrollInput.value / baseBankroll;
        const start = baseBankroll * mult;
        let html = '';
        if (optimalCap !== null) {
            const finalCap = simulateAlt(mult, dataRows, 'capped');
            const end = finalCap.length > 0 ? finalCap[finalCap.length - 1] : start;
            const gainPct = ((end / start) - 1) * 100;
            html += `→ Kelly + cap : <strong>${optimalCap.toFixed(2)}%</strong> · ${end.toFixed(2)}€ (${gainPct >= 0 ? '+' : ''}${gainPct.toFixed(2)}%)`;
        }
        if (optimalFlat !== null) {
            const finalFlat = simulateAlt(mult, dataRows, 'flat');
            const end = finalFlat.length > 0 ? finalFlat[finalFlat.length - 1] : start;
            const gainPct = ((end / start) - 1) * 100;
            html += (html ? '<br>' : '') + `→ Mise fixe : <strong>${optimalFlat.toFixed(2)}%</strong> · ${end.toFixed(2)}€ (${gainPct >= 0 ? '+' : ''}${gainPct.toFixed(2)}%)`;
        }
        capResult.innerHTML = html || 'Cliquez sur Optimiser pour calculer';
    }

    function calcOptimalCap(min, max, step) {
        const mult = +bankrollInput.value / baseBankroll;

        const bets = [];
        for (const r of dataRows) {
            const result = (r[10] || "").toLowerCase();
            if (result !== "oui" && result !== "non") continue;
            const odds = parseFloat((r[6] || "1").replace(',', '.'));
            const kellyPct = parseFloat((r[7] || "0").replace(',', '.')) / 100;
            bets.push({ kellyPct, odds, won: result === "oui" });
        }

        if (bets.length === 0) return;

        let bestCap = min;
        let bestFinal = 0;

        for (let cap = min; cap <= max + 1e-9; cap += step) {
            let b = baseBankroll * mult;
            for (const bet of bets) {
                const cappedPct = Math.min(bet.kellyPct, cap / 100);
                const stake = b * cappedPct;
                b += bet.won ? stake * (bet.odds - 1) : -stake;
            }
            if (b > bestFinal) { bestFinal = b; bestCap = cap; }
        }

        optimalCap = Math.round(bestCap * 100) / 100;
    }

    function calcOptimalFlat(min, max, step) {
        const mult = +bankrollInput.value / baseBankroll;

        const bets = [];
        for (const r of dataRows) {
            const result = (r[10] || "").toLowerCase();
            if (result !== "oui" && result !== "non") continue;
            const odds = parseFloat((r[6] || "1").replace(',', '.'));
            bets.push({ odds, won: result === "oui" });
        }

        if (bets.length === 0) return;

        let bestPct = min;
        let bestFinal = 0;

        for (let pct = min; pct <= max + 1e-9; pct += step) {
            let b = baseBankroll * mult;
            for (const bet of bets) {
                const stake = b * (pct / 100);
                b += bet.won ? stake * (bet.odds - 1) : -stake;
            }
            if (b > bestFinal) { bestFinal = b; bestPct = pct; }
        }

        optimalFlat = Math.round(bestPct * 100) / 100;
    }

    function simulateAlt(mult, rows, modeOverride) {
        const mode = modeOverride || document.querySelector('input[name="capMode"]:checked').value;
        const path = [];
        let bk = baseBankroll * mult;
        for (const r of rows) {
            const result = (r[10] || "").toLowerCase();
            const odds = parseFloat((r[6] || "1").replace(',', '.'));
            let stake = 0;
            if (mode === 'capped' && optimalCap !== null) {
                const kellyPct = parseFloat((r[7] || "0").replace(',', '.')) / 100;
                const cappedPct = Math.min(kellyPct, optimalCap / 100);
                stake = bk * cappedPct;
            } else if (mode === 'flat' && optimalFlat !== null) {
                stake = bk * (optimalFlat / 100);
            }
            if (result === "oui") {
                bk += stake * (odds - 1);
            } else if (result === "non") {
                bk -= stake;
            }
            path.push(bk);
        }
        return path;
    }

    function renderCapChart(mult, originalBankrolls, filteredIndices) {
        const mode = document.querySelector('input[name="capMode"]:checked').value;
        capMode = mode;

        const s = getComputedStyle(document.documentElement);
        const accent = s.getPropertyValue('--accent');
        const labels = originalBankrolls.map((_, i) => i + 1);

        const datasets = [{
            data: originalBankrolls,
            borderWidth: 2,
            tension: 0.35,
            pointRadius: 0,
            label: 'Kelly',
            borderColor: accent,
            order: 0,
        }];

        const showAlt = (mode === 'capped' && optimalCap !== null) || (mode === 'flat' && optimalFlat !== null);

        if (showAlt) {
            const fullPath = simulateAlt(mult, dataRows);
            const alt = filteredIndices.map(i => fullPath[i]);
            const label = mode === 'capped'
                ? `Kelly + cap ${optimalCap.toFixed(2)}%`
                : `Mise fixe ${optimalFlat.toFixed(2)}%`;
            datasets.push({
                data: alt,
                borderWidth: 2,
                tension: 0.35,
                pointRadius: 0,
                label,
                borderColor: '#f59e42',
                borderDash: [6, 3],
                order: 1,
            });
        }

        chart.data.labels = labels;
        chart.data.datasets = datasets;

        const opts = chartOptions();
        if (showAlt) {
            opts.plugins.legend = {
                display: true,
                position: 'bottom',
                labels: {
                    color: s.getPropertyValue('--muted'),
                    boxWidth: 18,
                    padding: 14,
                    font: { size: 11 },
                    usePointStyle: true,
                    pointStyle: 'line',
                }
            };
        }
        chart.options = opts;
        chart.update();
    }

    function renderAltStats(mult) {
        const mode = document.querySelector('input[name="capMode"]:checked').value;
        const showAlt = (mode === 'capped' && optimalCap !== null) || (mode === 'flat' && optimalFlat !== null);

        if (!showAlt) {
            cappedStats.innerHTML = '';
            return;
        }

        const fullPath = simulateAlt(mult, dataRows);
        const end = fullPath.length > 0 ? fullPath[fullPath.length - 1] : baseBankroll * mult;
        const start = baseBankroll * mult;

        const perf = end - start;
        const pct = (end / start - 1) * 100;

        const first = parseDate(dataRows[0][2]);
        const last = parseDate(dataRows[dataRows.length - 1][2]);
        const days = (last - first) / 86400000;
        const months = days / 30.4375;
        const years = days / 365.25;

        const ann = (Math.pow(end / start, 1 / years) - 1) * 100;
        const mon = (Math.pow(end / start, 1 / months) - 1) * 100;

        const label = mode === 'capped'
            ? `Kelly + cap ${optimalCap.toFixed(2)}%`
            : `Mise fixe ${optimalFlat.toFixed(2)}%`;

        const kellyEnd = parseFloat(dataRows[dataRows.length - 1][11].replace(',', '.')) * mult;
        const vsKelly = end - kellyEnd;

        cappedStats.innerHTML = `
    <div class="stat">
        <b style="color:#f59e42;">${label}</b>
    </div>
    <div class="stat">
        <b>Performance</b>
        <span style="color:${perf>=0?'var(--accent)':'red'}">
            ${perf.toFixed(2)}€ (${pct.toFixed(2)}%)
        </span>
    </div>
    <div class="stat">
        <b>Annualized</b>
        ${isFinite(ann)?ann.toFixed(2):'—'} %
    </div>
    <div class="stat">
        <b>Monthly</b>
        ${isFinite(mon)?mon.toFixed(2):'—'} %
    </div>
    <div class="stat">
        <b>vs Kelly</b>
        <span style="color:${vsKelly>=0?'var(--accent)':'red'}">
            ${vsKelly >= 0 ? '+' : ''}${vsKelly.toFixed(2)}€
        </span>
    </div>
    `;
    }

    function chartOptions() {
        const s = getComputedStyle(document.documentElement);
        return {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: {
                    grid: { color: s.getPropertyValue('--grid') },
                    ticks: { color: s.getPropertyValue('--muted') }
                }
            }
        };
    }
</script>

</body>

</html>

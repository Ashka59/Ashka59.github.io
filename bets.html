<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* ========= THEME ========= */
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #111111;
            --muted: #6b7280;
            --accent: #16a34a;
            --border: #e5e7eb;
            --grid: #eeeeee;
        }

        [data-theme="dark"] {
            --bg: #0b0c0f;
            --card: #14161b;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --accent: #22c55e;
            --border: #262a32;
            --grid: #1f232b;
        }

        /* ========= BASE ========= */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 100%;
            width: 100%;
            margin: auto;
            padding: 1.5rem;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* ========= CARDS ========= */
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            margin-bottom: 2rem;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        label {
            font-size: 0.85rem;
            color: var(--muted);
        }

        input[type="number"] {
            padding: 0.45rem 0.7rem;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            width: 140px;
        }

        /* ========= TOGGLE ========= */
        .toggle {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--muted);
        }

        /* ========= STATS ========= */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat {
            font-size: 0.9rem;
        }

        .stat b {
            display: block;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        /* ========= CHART ========= */
        .chart-wrapper {
            height: 280px;
        }

        /* ========= TABLE ========= */
        .table-wrapper {
            overflow-x: auto;
            max-width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 600px;
        }

        th, td {
            padding: 0.85rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
        }

        tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* ========= OPTIM TABLE ========= */
        .opt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 700px;
        }
        .opt-table th, .opt-table td {
            padding: 0.5rem 0.7rem;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }
        .opt-table th:first-child, .opt-table td:first-child {
            text-align: left;
        }
        .opt-table th {
            font-weight: 500;
            color: var(--muted);
        }
        .opt-table tbody tr:nth-child(1) {
            border-bottom: 2px solid var(--accent);
        }
        .opt-table tbody tr:nth-child(3) {
            border-bottom: 2px solid var(--accent);
        }
        .opt-table tbody tr:nth-child(5) {
            border-bottom: 2px solid var(--accent);
        }
        .opt-table tbody tr:nth-child(7) {
            border-bottom: 2px solid var(--accent);
        }

        /* ========= EVENT COLUMN ========= */
        #betsTable th[data-col="4"],
        #betsTable td:nth-child(4) {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ========= MOBILE ========= */
        @media (max-width: 768px) {
            h1 { font-size: 1.4rem; }
            .chart-wrapper { height: 220px; }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Betting Tracker</h1>

    <div class="card">
        <div class="row">
            <div>
                <label>Initial Bankroll (€)</label><br>
                <input type="number" id="bankrollInput" value="100" min="1" step="any">
            </div>
            <div class="toggle" id="themeToggle">🌙 Dark mode</div>
        </div>

        <div class="cap-controls" style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border);">
            <div class="row">
                <div>
                    <label>Chute max (%)</label><br>
                    <input type="number" id="maxDrawdownInput" value="100" min="1" max="100" step="1" style="width:80px;">
                </div>
                <div>
                    <label>&nbsp;</label><br>
                    <button id="calcCapBtn" style="padding:0.45rem 1rem; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;">
                        🎯 Optimiser
                    </button>
                </div>
            </div>
            <div id="durationDisplay" style="margin-top:0.5rem; font-size:0.9rem; color:var(--muted);"></div>
            <div id="optimTable" style="margin-top:0.75rem;"></div>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <div class="chart-wrapper" style="flex:2; min-width:0;">
                <canvas id="performanceChart"></canvas>
            </div>
            <div style="flex:1; min-width:220px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2rem;">
                <div style="width:210px;">
                    <canvas id="statusPieChart"></canvas>
                    <div id="pieStats" style="text-align:center; margin-top:0.5rem; font-size:0.95rem;"></div>
                </div>
                <div style="width:210px;">
                    <canvas id="sportPieChart"></canvas>
                    <div id="sportPieStats" style="text-align:center; margin-top:0.5rem; font-size:0.95rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0;font-size:1.1rem;">History</h2>
        <div class="table-wrapper">
            <table id="betsTable">
                <thead>
                <tr>
                    <th data-col="0">Sport</th>
                    <th data-col="1">Bookmaker</th>
                    <th data-col="3">Date</th>
                    <th data-col="4">Event</th>
                    <th data-col="5">Result</th>
                    <th data-col="6">Odds</th>
                    <th data-col="9">Stake</th>
                    <th data-col="12">Gains</th>
                    <th data-col="11">Bankroll</th>
                    <th data-col="10">Won?</th>
                </tr>
                <tr id="filterRow">
                    <th><input type="text" data-col="0" style="width:90%"></th>
                    <th><input type="text" data-col="1" style="width:90%"></th>
                    <th><input type="text" data-col="3" style="width:90%"></th>
                    <th><input type="text" data-col="4" style="width:90%"></th>
                    <th><input type="text" data-col="5" style="width:90%"></th>
                    <th><input type="text" data-col="6" style="width:90%"></th>
                    <th><input type="text" data-col="9" style="width:90%"></th>
                    <th><input type="text" data-col="12" style="width:90%"></th>
                    <th><input type="text" data-col="11" style="width:90%"></th>
                    <th><input type="text" data-col="10" style="width:90%"></th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1n30c7z0w0pjch9r6svRKohpPGMm1ePx9_KxhNgBkdCQ/export?format=csv&gid=786289597';
    const baseBankroll = 100;
    let chart, dataRows = [], pieChart, sportPieChart;
    let sortCol = null, sortDir = 1;
    let filters = {};

    const MODES = ['return', 'calmar'];
    const COLORS = ['#22c55e', '#eab308', '#06b6d4', '#ef4444', '#a855f7', '#f97316', '#3b82f6'];

    const parseDate = s => {
        const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?: (\d{1,2}):(\d{2}))?/);
        if (!m) return null;
        return new Date(m[3], m[2]-1, m[1], m[4]||0, m[5]||0);
    };

    const isZeroStake = s => {
        const v = (s || "").replace(',', '.').replace('%', '').trim();
        return v !== "" && parseFloat(v) === 0;
    };

    function buildEvents(rows) {
        const events = [];
        for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const placeDate = parseDate(r[2]) || parseDate(r[3]);
            if (!placeDate) continue;
            const result = (r[10] || "").toLowerCase();
            const odds = parseFloat((r[6] || "1").replace(',', '.'));
            const kellyPct = parseFloat((r[7] || "0").replace(',', '.')) / 100;
            const isBoosted = isZeroStake(r[7]);
            events.push({ d: placeDate, t: 0, i, result, odds, kellyPct, isBoosted });
            if (result === "oui" || result === "non") {
                const evDate = parseDate(r[3]);
                const resDate = evDate && evDate >= placeDate ? evDate : placeDate;
                events.push({ d: resDate, t: 1, i, result, odds, kellyPct, isBoosted });
            }
        }
        events.sort((a, b) => {
            const d = a.d - b.d;
            return d !== 0 ? d : a.t !== b.t ? a.t - b.t : a.i - b.i;
        });
        return events;
    }

    function computeDisplayBankrolls(rows, mult) {
        const events = buildEvents(rows);
        const out = new Array(rows.length);
        const stakes = new Array(rows.length);
        let bk = baseBankroll * mult;
        for (const ev of events) {
            if (ev.t === 0) {
                const stake = ev.isBoosted ? Math.min(10, bk) : bk * ev.kellyPct;
                stakes[ev.i] = stake;
                bk -= stake;
            } else {
                if (ev.result === "oui") bk += stakes[ev.i] * ev.odds;
            }
            out[ev.i] = bk;
        }
        return out;
    }

    fetch(sheetUrl)
        .then(r => r.text())
        .then(csv => {
            Papa.parse(csv, {
                skipEmptyLines: true,
                complete: res => {
                    dataRows = res.data.slice(6).filter(r => r[0]);
                    init();
                }
            });
        });

    function init() {
        chart = new Chart(document.getElementById('performanceChart'), {
            type: "line",
            data: { labels: [], datasets: [] },
            options: chartOptions()
        });
        bankrollInput.addEventListener("input", update);
        calcCapBtn.addEventListener("click", calcAndOptimize);
        betsTable.querySelectorAll('thead th[data-col]').forEach(th => {
            th.style.cursor = 'pointer';
            th.onclick = () => {
                const col = th.getAttribute('data-col');
                if (sortCol === col) sortDir = -sortDir;
                else { sortCol = col; sortDir = 1; }
                update();
            };
        });
        betsTable.querySelectorAll('#filterRow input').forEach(input => {
            input.oninput = () => {
                filters[input.getAttribute('data-col')] = input.value.toLowerCase();
                update();
            };
        });
        update();
    }

    function update() {
        const mult = bankrollInput.value / baseBankroll;
        renderTable(mult);
        renderSportPieChart();
    }

    function renderTable(mult) {
        const tbody = betsTable.querySelector("tbody");
        tbody.innerHTML = "";
        let rows = dataRows.slice();
        Object.entries(filters).forEach(([col, val]) => {
            if (val)
                rows = rows.filter(r => (r[col]||"").toLowerCase().includes(val));
        });
        if (sortCol !== null) {
            rows.sort((a, b) => {
                let va = a[sortCol]||"", vb = b[sortCol]||"";
                if (!isNaN(parseFloat(va)) && !isNaN(parseFloat(vb))) {
                    va = parseFloat(va.replace(',', '.'));
                    vb = parseFloat(vb.replace(',', '.'));
                }
                if (va < vb) return sortDir;
                if (va > vb) return -sortDir;
                return 0;
            });
        }
        const bankrolls = computeDisplayBankrolls(dataRows, mult);
        let winCount = 0, loseCount = 0, pendingCount = 0;
        rows.forEach((r, i) => {
            const eventDate = r[3];
            const gagne = (r[10] || "").toLowerCase();
            let gagneLabel = "pending", gagneColor = "#a259e6";
            if (gagne === "oui") { gagneLabel = "yes"; gagneColor = "#22c55e"; winCount++; }
            else if (gagne === "non") { gagneLabel = "no"; gagneColor = "#ef4444"; loseCount++; }
            else { pendingCount++; }
            const boosted = isZeroStake(r[7]);
            const odds = parseFloat((r[6] || "1").replace(',', '.'));
            let gains;
            if (boosted && gagne === "oui") {
                gains = (10 * odds).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (boosted) {
                gains = "-10,00";
            } else {
                gains = r[12] ? (parseFloat(r[12].replace(',', '.')) * mult).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0,00";
            }
            const bankroll = bankrolls[dataRows.indexOf(r)].toFixed(2);
            tbody.insertAdjacentHTML("beforeend", `
        <tr>
            <td>${r[0]}</td>
            <td>${r[1]}</td>
            <td>${eventDate}</td>
            <td>${r[4]}</td>
            <td>${r[5]}</td>
            <td>${r[6]}</td>
            <td>${boosted ? "10,00€" : r[7]}</td>
            <td>${gains}€</td>
            <td>${bankroll}€</td>
            <td><span style="color:${gagneColor};font-weight:600;">${gagneLabel}</span></td>
        </tr>
        `);
        });
        renderPieChart(winCount, loseCount, pendingCount);
    }

    function renderPieChart(win, lose, pending) {
        const total = win+lose+pending;
        const data = [win, lose, pending];
        const labels = ["Won", "Lost", "Pending"];
        const colors = ["#22c55e", "#ef4444", "#a259e6"];
        if(!pieChart) {
            pieChart = new Chart(document.getElementById('statusPieChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data, backgroundColor: colors }] },
                options: { plugins: { legend: { display: true, position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted') } } } }
            });
        } else {
            pieChart.data.datasets[0].data = data;
            pieChart.update();
        }
        let html = '';
        [win, lose, pending].forEach((n,i) => {
            const pct = total ? (n/total*100).toFixed(1) : '0.0';
            html += `<span style="color:${colors[i]};font-weight:600;">${labels[i]}</span> : ${pct}% (${n})<br>`;
        });
        pieStats.innerHTML = html;
    }

    function renderSportPieChart() {
        const sportCounts = {};
        dataRows.forEach(r => {
            const sport = r[0] || "Unknown";
            sportCounts[sport] = (sportCounts[sport] || 0) + 1;
        });
        const labels = Object.keys(sportCounts);
        const data = Object.values(sportCounts);
        const total = data.reduce((a, b) => a + b, 0);
        const colors = ["#22c55e", "#ef4444", "#a259e6", "#f59e42", "#3b82f6", "#eab308", "#10b981", "#6366f1"];
        if (!sportPieChart) {
            sportPieChart = new Chart(document.getElementById('sportPieChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data, backgroundColor: colors.slice(0, labels.length) }] },
                options: { plugins: { legend: { display: true, position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted') } } } }
            });
        } else {
            sportPieChart.data.labels = labels;
            sportPieChart.data.datasets[0].data = data;
            sportPieChart.update();
        }
        let html = '';
        labels.forEach((sport, i) => {
            const pct = total ? (data[i] / total * 100).toFixed(1) : '0.0';
            html += `<span style="color:${colors[i % colors.length]};font-weight:600;">${sport}</span> : ${pct}% (${data[i]})<br>`;
        });
        sportPieStats.innerHTML = html;
    }

    /* ========= THEME ========= */
    themeToggle.onclick = () => {
        const root = document.documentElement;
        const dark = root.dataset.theme === "dark";
        root.dataset.theme = dark ? "light" : "dark";
        themeToggle.textContent = dark ? "🌙 Dark mode" : "☀️ Light mode";
        update();
    };

    /* ========= OPTIMIZATION ========= */

    function calcOptimalCap(min, max, step, optMode, maxDD) {
        const mult = +bankrollInput.value / baseBankroll;
        const events = buildEvents(dataRows);
        if (events.length === 0) return null;

        const start = baseBankroll * mult;
        let best = null;
        let fallback = null;

        for (let cap = min; cap <= max + 1e-9; cap += step) {
            let b = start;
            let peak = b;
            let maxDrawdown = 0;
            const returns = [];
            const stakes = {};
            let prev = b;
            for (const ev of events) {
                if (ev.t === 0) {
                    const stake = ev.isBoosted ? Math.min(10, b) : b * Math.min(ev.kellyPct, cap / 100);
                    stakes[ev.i] = stake;
                    b -= stake;
                } else {
                    if (ev.result === "oui") b += stakes[ev.i] * ev.odds;
                }
                returns.push((b - prev) / prev);
                prev = b;
                if (b > peak) peak = b;
                const dd = peak > 0 ? (peak - b) / peak : 0;
                if (dd > maxDrawdown) maxDrawdown = dd;
            }
            const rendement = b - start;
            const mean = returns.reduce((s, v) => s + v, 0) / returns.length;
            const variance = returns.reduce((s, v) => s + (v - mean) ** 2, 0) / returns.length;
            const std = Math.sqrt(variance);
            const negVariance = returns.reduce((s, v) => s + (v < 0 ? v * v : 0), 0) / returns.length;
            const downStd = Math.sqrt(negVariance);

            if (!fallback || maxDrawdown < fallback.dd) {
                fallback = {
                    cap, final: b, dd: maxDrawdown,
                    sharpe: std > 0 ? mean / std : 0,
                    sortino: downStd > 0 ? mean / downStd : 0,
                    calmar: maxDrawdown > 0 ? rendement / maxDrawdown : 0,
                    score: b, rendement
                };
            }

            if (maxDrawdown > maxDD) continue;

            let score = b;
            if (optMode === 'calmar' && maxDrawdown > 0) score = rendement / maxDrawdown;

            if (!best || score > best.score + 1e-10 || (Math.abs(score - best.score) <= 1e-10 && b > best.final)) {
                best = {
                    cap, final: b, dd: maxDrawdown,
                    sharpe: std > 0 ? mean / std : 0,
                    sortino: downStd > 0 ? mean / downStd : 0,
                    calmar: maxDrawdown > 0 ? rendement / maxDrawdown : 0,
                    score, rendement
                };
            }
        }
        return best || fallback;
    }

    function calcOptimalFlat(min, max, step, optMode, maxDD) {
        const mult = +bankrollInput.value / baseBankroll;
        const events = buildEvents(dataRows);
        if (events.length === 0) return null;

        const start = baseBankroll * mult;
        let best = null;
        let fallback = null;

        for (let pct = min; pct <= max + 1e-9; pct += step) {
            let b = start;
            let peak = b;
            let maxDrawdown = 0;
            const returns = [];
            const stakes = {};
            let prev = b;
            for (const ev of events) {
                if (ev.t === 0) {
                    const stake = ev.isBoosted ? Math.min(10, b) : b * (pct / 100);
                    stakes[ev.i] = stake;
                    b -= stake;
                } else {
                    if (ev.result === "oui") b += stakes[ev.i] * ev.odds;
                }
                returns.push((b - prev) / prev);
                prev = b;
                if (b > peak) peak = b;
                const dd = peak > 0 ? (peak - b) / peak : 0;
                if (dd > maxDrawdown) maxDrawdown = dd;
            }
            const rendement = b - start;
            const mean = returns.reduce((s, v) => s + v, 0) / returns.length;
            const variance = returns.reduce((s, v) => s + (v - mean) ** 2, 0) / returns.length;
            const std = Math.sqrt(variance);
            const negVariance = returns.reduce((s, v) => s + (v < 0 ? v * v : 0), 0) / returns.length;
            const downStd = Math.sqrt(negVariance);

            if (!fallback || maxDrawdown < fallback.dd) {
                fallback = {
                    pct, final: b, dd: maxDrawdown,
                    sharpe: std > 0 ? mean / std : 0,
                    sortino: downStd > 0 ? mean / downStd : 0,
                    calmar: maxDrawdown > 0 ? rendement / maxDrawdown : 0,
                    score: b, rendement
                };
            }

            if (maxDrawdown > maxDD) continue;

            let score = b;
            if (optMode === 'calmar' && maxDrawdown > 0) score = rendement / maxDrawdown;

            if (!best || score > best.score + 1e-10 || (Math.abs(score - best.score) <= 1e-10 && b > best.final)) {
                best = {
                    pct, final: b, dd: maxDrawdown,
                    sharpe: std > 0 ? mean / std : 0,
                    sortino: downStd > 0 ? mean / downStd : 0,
                    calmar: maxDrawdown > 0 ? rendement / maxDrawdown : 0,
                    score, rendement
                };
            }
        }
        return best || fallback;
    }

    function simulateKelly(mult, rows) {
        const events = buildEvents(rows);
        const path = [];
        const stakes = {};
        let bk = baseBankroll * mult;
        for (const ev of events) {
            if (ev.t === 0) {
                const stake = ev.isBoosted ? Math.min(10, bk) : bk * ev.kellyPct;
                stakes[ev.i] = stake;
                bk -= stake;
            } else {
                if (ev.result === "oui") bk += stakes[ev.i] * ev.odds;
            }
            path.push(bk);
        }
        return path;
    }

    function simulateCapped(mult, rows, capPct) {
        const events = buildEvents(rows);
        const path = [];
        const stakes = {};
        let bk = baseBankroll * mult;
        for (const ev of events) {
            if (ev.t === 0) {
                const stake = ev.isBoosted ? Math.min(10, bk) : bk * Math.min(ev.kellyPct, capPct / 100);
                stakes[ev.i] = stake;
                bk -= stake;
            } else {
                if (ev.result === "oui") bk += stakes[ev.i] * ev.odds;
            }
            path.push(bk);
        }
        return path;
    }

    function simulateFlat(mult, rows, flatPct) {
        const events = buildEvents(rows);
        const path = [];
        const stakes = {};
        let bk = baseBankroll * mult;
        for (const ev of events) {
            if (ev.t === 0) {
                const stake = ev.isBoosted ? Math.min(10, bk) : bk * (flatPct / 100);
                stakes[ev.i] = stake;
                bk -= stake;
            } else {
                if (ev.result === "oui") bk += stakes[ev.i] * ev.odds;
            }
            path.push(bk);
        }
        return path;
    }

    function calcMetrics(path, start, days) {
        const end = path.length > 0 ? path[path.length - 1] : start;
        const months = days / 30.4375;
        const years = days / 365.25;
        const perf = end - start;
        const perfPct = (end / start - 1) * 100;
        const annPct = years > 0 && start > 0 ? (Math.pow(end / start, 1 / years) - 1) * 100 : 0;
        const monPct = months > 0 && start > 0 ? (Math.pow(end / start, 1 / months) - 1) * 100 : 0;

        const returns = [];
        let prev = start;
        let totalProfits = 0, totalLosses = 0;
        for (const val of path) {
            const ret = (val - prev) / prev;
            returns.push(ret);
            const change = val - prev;
            if (change > 0) totalProfits += change;
            else totalLosses += -change;
            prev = val;
        }
        const mean = returns.reduce((s, v) => s + v, 0) / returns.length;
        const variance = returns.reduce((s, v) => s + (v - mean) ** 2, 0) / returns.length;
        const std = Math.sqrt(variance);
        const negVariance = returns.reduce((s, v) => s + (v < 0 ? v * v : 0), 0) / returns.length;
        const downStd = Math.sqrt(negVariance);

        let peak = start;
        let maxDrawdown = 0;
        for (const val of path) {
            if (val > peak) peak = val;
            const dd = peak > 0 ? (peak - val) / peak : 0;
            if (dd > maxDrawdown) maxDrawdown = dd;
        }

        const calmar = maxDrawdown > 0 ? (end - start) / maxDrawdown : 0;
        const sharpe = std > 0 ? mean / std : 0;
        const sortino = downStd > 0 ? mean / downStd : 0;
        const profitFactor = totalLosses > 0 ? totalProfits / totalLosses : totalProfits > 0 ? Infinity : 0;
        const expectedReturn = mean * 100;

        return { perf, perfPct, annPct, monPct, calmar, sharpe, sortino, profitFactor, expectedReturn, maxDrawdown: maxDrawdown * 100 };
    }

    function formatPerf(perf, pct) {
        const sign = perf >= 0 ? '+' : '';
        return `${sign}${perf.toFixed(2)}€ (${sign}${pct.toFixed(2)}%)`;
    }

    function formatPct(val) {
        const sign = val >= 0 ? '+' : '';
        return `${sign}${val.toFixed(2)}%`;
    }

    function formatRatio(val) {
        return val.toFixed(3);
    }

    function modeLabel(mode) {
        return mode === 'return' ? 'Rendement' : mode === 'calmar' ? 'Calmar' : mode === 'sharpe' ? 'Sharpe' : 'Sortino';
    }

    function calcAndOptimize() {
        const min = 0.01, max = 100, step = 0.01;
        const maxDD = (+maxDrawdownInput.value || 100) / 100;
        const mult = +bankrollInput.value / baseBankroll;
        const start = baseBankroll * mult;

        const first = parseDate(dataRows[0][2]);
        const last = parseDate(dataRows[dataRows.length - 1][2]);
        const days = (last - first) / 86400000;
        durationDisplay.textContent = `${days.toFixed(0)} days`;

        const kellyPath = simulateKelly(mult, dataRows);
        const kellyMetrics = calcMetrics(kellyPath, start, days);

        const cappedResults = [];
        for (const mode of MODES) {
            const opt = calcOptimalCap(min, max, step, mode, maxDD);
            if (!opt) continue;
            const path = simulateCapped(mult, dataRows, opt.cap);
            const metrics = calcMetrics(path, start, days);
            cappedResults.push({ mode, cap: opt.cap, path, metrics });
        }

        const flatResults = [];
        for (const mode of MODES) {
            const opt = calcOptimalFlat(min, max, step, mode, maxDD);
            if (!opt) continue;
            const path = simulateFlat(mult, dataRows, opt.pct);
            const metrics = calcMetrics(path, start, days);
            flatResults.push({ mode, pct: opt.pct, path, metrics });
        }

        const hybridResults = [];
        for (const r of flatResults) {
            const path = simulateCapped(mult, dataRows, r.pct);
            const metrics = calcMetrics(path, start, days);
            hybridResults.push({ mode: r.mode, pct: r.pct, path, metrics });
        }

        renderOptimTable(kellyMetrics, cappedResults, flatResults, hybridResults);

        const allPaths = [
            { label: 'Kelly', data: kellyPath, color: COLORS[0] },
            ...cappedResults.map((r, i) => ({
                label: `Kelly+Cap ${modeLabel(r.mode)} (${r.cap.toFixed(2)}%)`,
                data: r.path,
                color: COLORS[i + 1]
            })),
            ...flatResults.map((r, i) => ({
                label: `Mise fixe ${modeLabel(r.mode)} (${r.pct.toFixed(2)}%)`,
                data: r.path,
                color: COLORS[i + 3]
            })),
            ...hybridResults.map((r, i) => ({
                label: `Kelly+Cap+Mise ${modeLabel(r.mode)} (${r.pct.toFixed(2)}%)`,
                data: r.path,
                color: COLORS[i + 5]
            }))
        ];
        renderCapChart(allPaths);
    }

    function renderOptimTable(kellyMetrics, cappedResults, flatResults, hybridResults) {
        const rows = [
            { label: 'Kelly', pct: '—', metrics: kellyMetrics },
            ...cappedResults.map(r => ({ label: `Kelly+Cap (${modeLabel(r.mode)})`, pct: r.cap.toFixed(2) + '%', metrics: r.metrics })),
            ...flatResults.map(r => ({ label: `Mise fixe (${modeLabel(r.mode)})`, pct: r.pct.toFixed(2) + '%', metrics: r.metrics })),
            ...hybridResults.map(r => ({ label: `Kelly+Cap+Mise (${modeLabel(r.mode)})`, pct: r.pct.toFixed(2) + '%', metrics: r.metrics }))
        ];

        let best = { annPct: -Infinity, monPct: -Infinity, profitFactor: -Infinity, expectedReturn: -Infinity, maxDrawdown: Infinity, calmar: -Infinity, sharpe: -Infinity, sortino: -Infinity };
        for (const r of rows) {
            const m = r.metrics;
            if (!isNaN(m.annPct) && m.annPct > best.annPct) best.annPct = m.annPct;
            if (!isNaN(m.monPct) && m.monPct > best.monPct) best.monPct = m.monPct;
            if (isFinite(m.profitFactor) && m.profitFactor > best.profitFactor) best.profitFactor = m.profitFactor;
            if (!isNaN(m.expectedReturn) && m.expectedReturn > best.expectedReturn) best.expectedReturn = m.expectedReturn;
            if (!isNaN(m.maxDrawdown) && m.maxDrawdown < best.maxDrawdown) best.maxDrawdown = m.maxDrawdown;
            if (!isNaN(m.calmar) && m.calmar > best.calmar) best.calmar = m.calmar;
            if (!isNaN(m.sharpe) && m.sharpe > best.sharpe) best.sharpe = m.sharpe;
            if (!isNaN(m.sortino) && m.sortino > best.sortino) best.sortino = m.sortino;
        }

        const cell = (val, col, fmt) => {
            const v = fmt(val);
            if (isFinite(val) && Math.abs(val - best[col]) < 1e-10) {
                const color = col === 'maxDrawdown' ? '#ef4444' : '#22c55e';
                return `<b style="color:${color}">${v}</b>`;
            }
            return v;
        };

        let html = `<div style="overflow-x:auto;"><table class="opt-table">
            <thead><tr>
                <th>Stratégie</th>
                <th>Mise %</th>
                <th>Perf</th>
                <th>Perf ann.</th>
                <th>Perf mens.</th>
                <th>Fact. profit</th>
                <th>Rend. attendu</th>
                <th>Chute</th>
                <th>Calmar</th>
                <th>Sharpe</th>
                <th>Sortino</th>
            </tr></thead><tbody>`;

        for (const r of rows) {
            const m = r.metrics;
            const perfColor = m.perf >= 0 ? 'var(--accent)' : '#ef4444';
            html += `<tr><td><b>${r.label}</b></td>
                <td>${r.pct}</td>
                <td style="color:${perfColor}">${formatPerf(m.perf, m.perfPct)}</td>
                <td>${cell(m.annPct, 'annPct', formatPct)}</td>
                <td>${cell(m.monPct, 'monPct', formatPct)}</td>
                <td>${cell(m.profitFactor, 'profitFactor', v => isFinite(v) ? v.toFixed(3) : '∞')}</td>
                <td>${cell(m.expectedReturn, 'expectedReturn', formatPct)}</td>
                <td style="color:#ef4444">${cell(m.maxDrawdown, 'maxDrawdown', v => formatPct(-v))}</td>
                <td>${cell(m.calmar, 'calmar', formatRatio)}</td>
                <td>${cell(m.sharpe, 'sharpe', formatRatio)}</td>
                <td>${cell(m.sortino, 'sortino', formatRatio)}</td>
            </tr>`;
        }

        html += '</tbody></table></div>';
        optimTable.innerHTML = html;
    }

    function renderCapChart(allPaths) {
        const s = getComputedStyle(document.documentElement);
        const labels = allPaths[0]?.data.map((_, i) => i + 1) || [];

        chart.data.labels = labels;
        const dashes = [[], [4, 3], [2, 3], [8, 4], [6, 3, 2, 3], [4, 2, 1, 2], [10, 3, 2, 3]];
        chart.data.datasets = allPaths.map((p, i) => ({
            data: p.data,
            borderWidth: 2,
            tension: 0.35,
            pointRadius: 0,
            label: p.label,
            borderColor: p.color,
            borderDash: dashes[i % dashes.length],
        }));

        const opts = chartOptions();
        opts.plugins.legend = {
            display: true,
            position: 'bottom',
            labels: {
                color: s.getPropertyValue('--muted'),
                boxWidth: 18,
                padding: 14,
                font: { size: 11 },
                usePointStyle: true,
                pointStyle: 'line',
            }
        };
        chart.options = opts;
        chart.update();
    }

    function chartOptions() {
        const s = getComputedStyle(document.documentElement);
        return {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: {
                    grid: { color: s.getPropertyValue('--grid') },
                    ticks: { color: s.getPropertyValue('--muted') }
                }
            }
        };
    }
</script>
